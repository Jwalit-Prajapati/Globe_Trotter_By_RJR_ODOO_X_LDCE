spring:
  application:
    name: GlobeTrotter

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/globetrotter}
    username: ${SPRING_DATASOURCE_USERNAME:globetrotter}
    password: ${SPRING_DATASOURCE_PASSWORD:globetrotter}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:KQQ9CxP88cxy8Qwc20NK9s4QJrImKcPcOFPp+G++gAMQLjQh2MssDHHMQ4AVzJ9F}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
