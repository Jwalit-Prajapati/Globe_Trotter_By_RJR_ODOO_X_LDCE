services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: globetrotter
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter -d globetrotter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
