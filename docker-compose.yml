services:
  postgres:
    image: postgres:16-alpine
    container_name: globetrotter-postgres
    environment:
      POSTGRES_DB: globetrotter
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter -d globetrotter"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: globetrotter-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/globetrotter
      SPRING_DATASOURCE_USERNAME: globetrotter
      SPRING_DATASOURCE_PASSWORD: globetrotter
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: globetrotter-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:
